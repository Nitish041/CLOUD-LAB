      <text x="546" y="306" font-size="24" fill="#ffffff">
        <tspan x="546" dy="0">To be a premier institution in Technology and Management by fostering excellence</tspan>
        <tspan x="546" dy="36">in education, innovation, incubation and values to inspire and empower young minds.</tspan>
